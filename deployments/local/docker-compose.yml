      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully

  email:
    image: microservice-payment-gateway-grpc/email:latest
    container_name: email
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
    networks:
      - app_network
    depends_on:
      kafka-1:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
