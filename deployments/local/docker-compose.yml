name: payment-postgres-local

services:
  # 1 database = 1 bounded context: tiga instance PostgreSQL terpisah,
  # masing-masing di depan PgBouncer-nya sendiri. Service (dan migrasi) konek
  # lewat pooler, jadi DB_<CONTEXT>_HOST menunjuk ke container PgBouncer.
  # edoburu/pgbouncer selalu listen di port 5432 container; host memetakan
  # 6432/6433/6434 supaya service host-run (.env) bisa connect via localhost.
  postgres_identity:
    image: postgres:17-alpine
    container_name: payment-postgres-identity
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_identity
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - payment_postgres_identity_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_identity:
    image: edoburu/pgbouncer:latest
    container_name: payment-pgbouncer-identity
    environment:
      DB_HOST: postgres_identity
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: pg_identity
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6432:5432"
    networks:
      - app_network
    depends_on:
      postgres_identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pg_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_payment:
    image: postgres:17-alpine
    container_name: payment-postgres-payment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_payment
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - payment_postgres_payment_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_payment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_payment:
    image: edoburu/pgbouncer:latest
    container_name: payment-pgbouncer-payment
    environment:
      DB_HOST: postgres_payment
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: pg_payment
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6433:5432"
    networks:
      - app_network
    depends_on:
      postgres_payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pg_payment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_financial:
    image: postgres:17-alpine
    container_name: payment-postgres-financial
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_financial
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - payment_postgres_financial_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_financial"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_financial:
    image: edoburu/pgbouncer:latest
    container_name: payment-pgbouncer-financial
    environment:
      DB_HOST: postgres_financial
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: pg_financial
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6434:5432"
    networks:
      - app_network
    depends_on:
      postgres_financial:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pg_financial"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
    - 4040:4040
    networks:
      - app_network

  redis-node-1:
    image: redis:7.4-alpine
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "dragon_knight", "--masterauth", "dragon_knight"]
    networks:
      - app_network

  redis-node-2:
    image: redis:7.4-alpine
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "dragon_knight", "--masterauth", "dragon_knight"]
    networks:
      - app_network

  redis-node-3:
    image: redis:7.4-alpine
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "dragon_knight", "--masterauth", "dragon_knight"]
    networks:
      - app_network

  redis-node-4:
    image: redis:7.4-alpine
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "dragon_knight", "--masterauth", "dragon_knight"]
    networks:
      - app_network

  redis-node-5:
    image: redis:7.4-alpine
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "dragon_knight", "--masterauth", "dragon_knight"]
    networks:
      - app_network

  redis-node-6:
    image: redis:7.4-alpine
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "dragon_knight", "--masterauth", "dragon_knight"]
    networks:
      - app_network

  redis-cluster-init:
    image: redis:7.4-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-node-1:
        condition: service_started
      redis-node-2:
        condition: service_started
      redis-node-3:
        condition: service_started
      redis-node-4:
        condition: service_started
      redis-node-5:
        condition: service_started
      redis-node-6:
        condition: service_started
    command:
      - sh
      - -c
      - |
        for node in redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5 redis-node-6; do
          until redis-cli -h $$node -a dragon_knight ping > /dev/null 2>&1; do
            echo "Waiting for $$node to be ready..."
            sleep 1
          done
        done

        if redis-cli --no-auth-warning -a dragon_knight --cluster check redis-node-1:6379 > /dev/null 2>&1; then
          echo "Redis cluster already initialized and healthy"
          exit 0
        fi

        echo "Creating Redis cluster..."
        echo "yes" | redis-cli --no-auth-warning -a dragon_knight --cluster create \
        redis-node-1:6379 \
        redis-node-2:6379 \
        redis-node-3:6379 \
        redis-node-4:6379 \
        redis-node-5:6379 \
        redis-node-6:6379 \
        --cluster-replicas 1
    networks:
      - app_network

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter
    pid: "host"
    networks:
      - app_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../pkg/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - app_network
    environment:
      - CLICKHOUSE_USER=dragon
      - CLICKHOUSE_PASSWORD=dragon_knight
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-1:
    image: apache/kafka:4.3.1
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      # CLUSTER_ID (bukan KAFKA_CLUSTER_ID) adalah key yang dibaca
      # /etc/kafka/docker/configure; nilai lama diabaikan dan image jatuh ke
      # default bawaannya.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 10
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 5000
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 3000
      KAFKA_CONTROLLER_QUORUM_RETRY_BACKOFF_MS: 500
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092 && echo ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - apigateway
    networks:
      - app_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ./../../observability/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - app_network
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    networks:
      - app_network
    depends_on:
      kafka-1:
        condition: service_started
    command:
      - "--kafka.server=kafka-1:9092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 30s
      start_period: 120s
      timeout: 10s
      retries: 3

  loki:
    container_name: loki
    image: grafana/loki:3.5.8
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  apigateway:
    image: microservice-payment-gateway-grpc/apigateway:latest
    container_name: apigateway
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
    ports:
      - "5000:8080"
      - "8091:8091"
    networks:
      - app_network
    depends_on:
      kafka-1:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
      card:
        condition: service_started
      merchant:
        condition: service_started
      user:
        condition: service_started
      role:
        condition: service_started
      saldo:
        condition: service_started
      topup:
        condition: service_started
      transaction:
        condition: service_started
      transfer:
        condition: service_started
      withdraw:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=apigateway
      - PYROSCOPE_SERVER=http://pyroscope:4040
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka-1:9092
      - REDIS_ADDRS=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379

  auth:
    image: microservice-payment-gateway-grpc/auth:latest
    container_name: auth
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=auth
      - PYROSCOPE_SERVER=http://pyroscope:4040
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka-1:9092
      - REDIS_ADDRS=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
    networks:
