# Stats backfill runner: reads OLTP tables and enqueues historical events
# into each domain's outbox (relayed to Kafka by the F3 OutboxPublisher).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

# One-shot job: no HTTP layer.
quarkus.http.port=-1

quarkus.arc.exclude-types=com.sanedge.common.chaos.*,com.sanedge.common.config.RedisService,com.sanedge.common.observability.*,com.sanedge.common.utils.JwtUtil,com.sanedge.common.exception.mapper.*,com.sanedge.common.grpc.*

# Domains to backfill (comma-separated). Empty = all.
# BACKFILL_DOMAINS=transaction,topup,transfer,withdraw,saldo,merchant,card

# Optional lower bound on created_at (ISO, e.g. 2024-01-01T00:00:00Z).
# BACKFILL_FROM=2024-01-01T00:00:00Z

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=INFO
