quarkus.grpc.server.port=9006
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8086
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

# Identity schema is owned by the user service (Flyway); role only reads it
quarkus.hibernate-orm.database.default-schema=payment_identity
%test.quarkus.hibernate-orm.database.default-schema=public

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# Redis
quarkus.redis.hosts=${REDIS_HOSTS:redis://:dragon_knight@redis-node-1:6379}
quarkus.redis.client-type=${REDIS_CLIENT_TYPE:cluster}
