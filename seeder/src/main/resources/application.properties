# Seeder runner: only needs the reactive Postgres pool. No gRPC server,
# no Hibernate, no Flyway, no HTTP endpoint — the app seeds and exits.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

# Never start the HTTP layer for this one-shot job
quarkus.http.port=-1

# common carries a Jandex index with app-only beans (Redis, chaos, REST
# mappers, JWT, tracing). This runner does not bundle those extensions, so
# exclude the beans to keep the seeder app resolvable and lean.
quarkus.arc.exclude-types=com.sanedge.common.chaos.*,com.sanedge.common.config.RedisService,com.sanedge.common.observability.*,com.sanedge.common.utils.JwtUtil,com.sanedge.common.exception.mapper.*,com.sanedge.common.grpc.*

# Domains to seed (comma-separated). Empty = seed all discovered domains.
# SEED_DOMAINS=identity,merchant,card,saldo,topup,transaction,transfer,withdraw
quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=INFO
